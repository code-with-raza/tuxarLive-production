name: Production setup check

on:
  workflow_dispatch:
    inputs:
      configure_cloudinary_folder:
        description: 'One-time: grant the restricted key Contributor access to tuxar/ci (requires temporary setup secrets)'
        type: boolean
        default: false

permissions:
  contents: read

# Share the deployment lock: probes must not overlap a publish or each other.
concurrency:
  group: tuxar-production-setup
  cancel-in-progress: false

jobs:
  hosting:
    name: Check FTPS and website folder
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify TLS, upload/rename access and protected staging
        run: python3 scripts/ci/hosting.py check
        env:
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_TRANSPORT: ${{ vars.DEPLOY_TRANSPORT }}
          HOSTING_DOCUMENT_ROOT: ${{ vars.HOSTING_DOCUMENT_ROOT }}
          HOSTING_PORT: ${{ vars.HOSTING_PORT }}
          HOSTING_HOST: ${{ secrets.HOSTING_HOST }}
          HOSTING_USER: ${{ secrets.HOSTING_USER }}
          HOSTING_PASSWORD: ${{ secrets.HOSTING_PASSWORD }}
          HOSTING_SSH_PRIVATE_KEY: ${{ secrets.HOSTING_SSH_PRIVATE_KEY }}
          HOSTING_SSH_KNOWN_HOSTS: ${{ secrets.HOSTING_SSH_KNOWN_HOSTS }}
  database:
    name: Check database migration history (read only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/ci/backend.mjs --check
        env:
          PGOPTIONS: '-c default_transaction_read_only=on'
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_STRIPE_ENABLED: ${{ vars.VITE_STRIPE_ENABLED }}
  cloudinary:
    name: Check Cloudinary image upload
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check restricted key
        if: '!inputs.configure_cloudinary_folder'
        run: node scripts/ci/cloudinary-check.mjs
        env:
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_FOLDER_MODE: ${{ vars.CLOUDINARY_FOLDER_MODE || 'dynamic' }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      - name: Configure folder access once and verify restricted key
        if: inputs.configure_cloudinary_folder
        run: node scripts/ci/cloudinary-check.mjs --setup
        env:
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_FOLDER_MODE: ${{ vars.CLOUDINARY_FOLDER_MODE || 'dynamic' }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_SETUP_API_KEY: ${{ secrets.CLOUDINARY_SETUP_API_KEY }}
          CLOUDINARY_SETUP_API_SECRET: ${{ secrets.CLOUDINARY_SETUP_API_SECRET }}
