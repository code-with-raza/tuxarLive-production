name: CI and production deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release halfway through database or hosting writes. Older queued
# commits fail the branch-head check before receiving production mutations.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'tuxar-production-setup' || format('tuxar-check-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  checks:
    name: Code, security and deployment tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:functions
      - run: npm run test:security
      - run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v
      - name: Validate product changes without credentials or uploads
        run: node scripts/ci/catalogue.mjs --write-frontend
      - name: Check production bundle without connecting to production
        run: npx --no-install vite build
      - name: Scan repository history and generated bundle for credentials
        run: npm run audit:secrets

  production:
    name: Deploy production
    needs: checks
    # Enable once the production environment is configured. Feature branches and
    # pull requests cannot run this job or receive its deployment credentials.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref_type == 'branch' &&
      github.ref_name == (vars.PRODUCTION_BRANCH || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://tuxar.co.uk/en
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      # Require the approved payment setting; never guess it during deployment.
      VITE_STRIPE_ENABLED: ${{ vars.VITE_STRIPE_ENABLED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require the latest production commit
        run: node scripts/ci/release.mjs --current-commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check hosting access before changing production
        run: python3 scripts/ci/hosting.py check
        env: &hosting
          DEPLOY_TRANSPORT: ${{ vars.DEPLOY_TRANSPORT }}
          HOSTING_DOCUMENT_ROOT: ${{ vars.HOSTING_DOCUMENT_ROOT }}
          HOSTING_PORT: ${{ vars.HOSTING_PORT }}
          HOSTING_HOST: ${{ secrets.HOSTING_HOST }}
          HOSTING_USER: ${{ secrets.HOSTING_USER }}
          HOSTING_PASSWORD: ${{ secrets.HOSTING_PASSWORD }}
          HOSTING_SSH_PRIVATE_KEY: ${{ secrets.HOSTING_SSH_PRIVATE_KEY }}
          HOSTING_SSH_KNOWN_HOSTS: ${{ secrets.HOSTING_SSH_KNOWN_HOSTS }}
      - name: Check Supabase project and existing migration history
        run: node scripts/ci/backend.mjs --check
        env: &backend
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_FUNCTION_SECRETS: ${{ secrets.SUPABASE_FUNCTION_SECRETS }}
      - name: Verify restricted Cloudinary upload access
        run: node scripts/ci/cloudinary-check.mjs
        env: &cloudinary
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_FOLDER_MODE: ${{ vars.CLOUDINARY_FOLDER_MODE || 'dynamic' }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      - name: Upload referenced images and resolve product URLs
        run: node scripts/ci/catalogue.mjs --upload --write-frontend
        env: *cloudinary
      - name: Validate resolved catalogue and compile website before database writes
        run: |
          npm run typecheck
          npm run generate:sitemap
          npx --no-install vite build
      - name: Apply pending migrations, deploy functions and link product images
        run: node scripts/ci/backend.mjs
        env: *backend
      - name: Generate public pages using current live status and prices
        run: node scripts/prerender-public-pages.mjs
      - name: Scan final public files and create release manifest
        run: |
          npm run audit:secrets
          node scripts/ci/release.mjs
      - name: Retain the exact public website artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tuxar-website-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish website
        id: publish
        run: python3 scripts/ci/hosting.py publish
        env: *hosting
      - name: Verify the live release
        id: smoke
        run: node scripts/ci/smoke.mjs
      - name: Restore previous website if live verification fails
        if: failure() && steps.publish.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: python3 scripts/ci/hosting.py rollback
        env: *hosting
